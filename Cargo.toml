[package]
name = "cli-radio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Resilient terminal web radio powered by mpv"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
