volume = 85
language = "de"
random_mode = false
# Positive whole hours; missing/invalid values use 12. Restart after editing.
random_interval_hours = 12

[network]
# An HTTP proxy can carry both HTTP and HTTPS streams.
# Empty proxy: inherit environment variables.
proxy = ""
proxy_username = ""
proxy_password = ""
# Omit to inherit NO_PROXY/no_proxy; use "" to disable bypass.
# no_proxy = "localhost,127.0.0.1,.example.org"
